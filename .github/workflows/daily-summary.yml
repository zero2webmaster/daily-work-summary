name: Daily Work Summary

on:
  schedule:
    # Fire hourly at :05 (ride out GitHub cron's typical 5-15 min delay).
    # The Python script's time-of-day guard reads EMAIL_TIMEZONE +
    # EMAIL_SEND_HOUR + EMAIL_SEND_MINUTE Action variables and skips the
    # run unless we're inside the configured local window.
    # See: https://github.com/zero2webmaster/daily-work-summary#customizing-the-email-schedule
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate daily summary
        id: summary
        env:
          PAT_GITHUB: ${{ secrets.PAT_GITHUB }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          # Scheduling controls — admins set these in Settings → Actions → Variables.
          # All four have sensible defaults, so unset = 22:30 America/New_York with a 60-minute window.
          EMAIL_TIMEZONE: ${{ vars.EMAIL_TIMEZONE }}
          EMAIL_SEND_HOUR: ${{ vars.EMAIL_SEND_HOUR }}
          EMAIL_SEND_MINUTE: ${{ vars.EMAIL_SEND_MINUTE }}
          EMAIL_SEND_WINDOW_MIN: ${{ vars.EMAIL_SEND_WINDOW_MIN }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DELIVERY_METHOD: ${{ vars.DELIVERY_METHOD }}
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID || vars.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_SUMMARIES: ${{ secrets.AIRTABLE_TABLE_SUMMARIES || vars.AIRTABLE_TABLE_SUMMARIES }}
          AIRTABLE_TABLE_REPOS: ${{ secrets.AIRTABLE_TABLE_REPOS || vars.AIRTABLE_TABLE_REPOS }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python .github/scripts/generate_summary.py

      - name: Set subject date for email
        id: subject
        if: steps.summary.outputs.should_run == 'true' && steps.summary.outputs.has_summary == 'true'
        env:
          EMAIL_TIMEZONE: ${{ vars.EMAIL_TIMEZONE }}
        run: |
          SUBJECT_DATE=$(TZ="${EMAIL_TIMEZONE:-America/New_York}" date +'%a %b %d')
          echo "subject_date=$SUBJECT_DATE" >> $GITHUB_OUTPUT

      - name: Commit summary to repo
        if: steps.summary.outputs.should_run == 'true' && steps.summary.outputs.has_summary == 'true'
        run: |
          git config user.name "Daily Summary Bot"
          git config user.email "daily-summary@users.noreply.github.com"
          git add summaries/
          git diff --cached --quiet || git commit -m "Add daily summary for ${{ steps.summary.outputs.local_date }}"
          git push

      - name: Send email
        if: >-
          steps.summary.outputs.should_run == 'true' &&
          steps.summary.outputs.has_summary == 'true' &&
          steps.summary.outputs.send_email == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Daily Work Summary — ${{ steps.subject.outputs.subject_date }}"
          to: kerry@zero2webmaster.com
          from: ${{ secrets.EMAIL_USERNAME }}
          html_body: file://${{ steps.summary.outputs.summary_file }}

      # Dead-man's-switch heartbeat (see Skill Vault [[scheduled-job-liveness]]).
      # Pings an Uptime Kuma PUSH monitor ONLY on the day's real run (should_run
      # == true) AND only if every prior step succeeded (success()) — so a silent
      # skip (guard never fires), a crash, OR a failed email send all WITHHOLD the
      # ping and trip the monitor in hours, not a week. No-op skipped runs and
      # quiet/no-commit days (should_run false) correctly do not ping.
      # Safe to merge before the secret exists: the step no-ops if it's unset.
      - name: Heartbeat — ping Uptime Kuma (dead-man's-switch)
        if: success() && steps.summary.outputs.should_run == 'true'
        env:
          UPTIME_KUMA_PUSH_URL: ${{ secrets.UPTIME_KUMA_PUSH_URL }}
        run: |
          if [ -z "$UPTIME_KUMA_PUSH_URL" ]; then
            echo "UPTIME_KUMA_PUSH_URL not configured — skipping heartbeat (no-op)."
            exit 0
          fi
          # Append status/msg as query params to the base push URL (…/api/push/<token>).
          curl -fsS --retry 2 --max-time 20 \
            "${UPTIME_KUMA_PUSH_URL}?status=up&msg=daily-summary-${{ steps.summary.outputs.local_date }}" \
            && echo "Heartbeat ping sent." \
            || echo "Heartbeat ping failed (non-fatal — Kuma unreachable, not the email)."
