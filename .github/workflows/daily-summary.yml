name: Daily Work Summary

on:
  schedule:
    # Three scheduled starts a day (v2.2.0). Until v2.1.1 this file also had an
    # hourly '5 * * * *' line and a 23:40 slot: ~30 starts a day, every one
    # billed as at least a minute even though the guard in the script skipped
    # all but one (Nov 1-24 2026: 719 runs, ~900 billed minutes/month, a third
    # of the account's Actions allowance; raised by audit-engine 2026-11-24).
    # Since Oct 17 every email was sent by the 23:10 slot (23:15-23:19 ET), so
    # the hourly line delivered nothing.
    #
    # Slot runs at 23:10 + 23:25 ET. Cron is UTC and has no daylight-saving
    # rule, so the hour is split by month: Apr-Oct are all EDT (03:xx UTC),
    # Dec-Feb all EST (04:xx UTC), and March/November, which change over
    # mid-month, get both hours. The script's time-of-day guard skips the
    # hour that lands at 22:xx, and the concurrency group + per-day
    # idempotency stop a second send.
    #
    # These lines are tuned to EMAIL_SEND_HOUR=23 America/New_York. If you
    # change the send time, change these too (README: "Customizing the email
    # schedule").
    - cron: '10,25 3 * 4-10 *'
    - cron: '10,25 4 * 12,1,2 *'
    - cron: '10,25 3,4 * 3,11 *'
    # Safety net if GitHub drops both slot runs: 05:40 UTC = 00:40 EST /
    # 01:40 EDT, inside the 480-minute send window and in the hours GitHub
    # fires most reliably. On a normal night it finds the summary already
    # committed and exits. A missed night also trips the Uptime Kuma heartbeat.
    - cron: '40 5 * * *'
  workflow_dispatch:

# Serialize runs so two near-simultaneous scheduled runs can't both pass the
# idempotency check before either has committed the day's archive file.
concurrency:
  group: daily-work-summary
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Check out the branch TIP, not the commit the run was queued on.
          # By default checkout uses github.sha, which is fixed when the event
          # fires. A run that waited in the concurrency queue therefore never
          # saw the summary the previous run had just pushed, so the per-day
          # idempotency check missed, it regenerated the same file, and its
          # push was rejected ("fetch first"). That was the nightly
          # "CI failed: Commit summary to repo" incident, Oct 28-31 2026.
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate daily summary
        id: summary
        env:
          PAT_GITHUB: ${{ secrets.PAT_GITHUB }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          # Scheduling controls — admins set these in Settings → Actions → Variables.
          # All four have sensible defaults, so unset = 22:30 America/New_York with a 480-minute window.
          EMAIL_TIMEZONE: ${{ vars.EMAIL_TIMEZONE }}
          EMAIL_SEND_HOUR: ${{ vars.EMAIL_SEND_HOUR }}
          EMAIL_SEND_MINUTE: ${{ vars.EMAIL_SEND_MINUTE }}
          EMAIL_SEND_WINDOW_MIN: ${{ vars.EMAIL_SEND_WINDOW_MIN }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DELIVERY_METHOD: ${{ vars.DELIVERY_METHOD }}
          # Headline Skill Vault tally in the email (default on). Set the
          # SKILL_VAULT_TALLY Action variable to "false" to turn it off.
          SKILL_VAULT_TALLY: ${{ vars.SKILL_VAULT_TALLY }}
          # Repos rendered as a single collapsed line (agent/coordination
          # bookkeeping). Unset = z2w-agent-coordination; set to "none" to disable.
          COLLAPSE_REPOS: ${{ vars.COLLAPSE_REPOS }}
          # Extra commit authors counted as your work (default: Claude Code cloud
          # sessions, noreply@anthropic.com). Set to "none" to count only your login.
          EXTRA_COMMIT_AUTHORS: ${{ vars.EXTRA_COMMIT_AUTHORS }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python .github/scripts/generate_summary.py

      - name: Set subject date for email
        id: subject
        if: steps.summary.outputs.should_run == 'true' && steps.summary.outputs.has_summary == 'true'
        env:
          # The date the summary REPORTS ON, emitted by the script — not the
          # wall-clock date here. The nightly run usually fires after midnight,
          # so `date` would name the following day and the subject would
          # disagree with the heading inside the email (the off-by-one Kerry
          # reported 2026-06-23 and 2026-06-27).
          LOCAL_DATE: ${{ steps.summary.outputs.local_date }}
        run: |
          set -euo pipefail
          SUBJECT_DATE=$(date -u -d "${LOCAL_DATE}" +'%a %b %d, %Y')
          echo "subject_date=$SUBJECT_DATE" >> $GITHUB_OUTPUT
          echo "Subject date: $SUBJECT_DATE (from local_date=${LOCAL_DATE})"

      - name: Commit summary to repo
        if: steps.summary.outputs.should_run == 'true' && steps.summary.outputs.has_summary == 'true'
        run: |
          git config user.name "Daily Summary Bot"
          git config user.email "daily-summary@users.noreply.github.com"
          git add summaries/
          git diff --cached --quiet || git commit -m "Add daily summary for ${{ steps.summary.outputs.local_date }}"
          git push

      - name: Send email
        if: >-
          steps.summary.outputs.should_run == 'true' &&
          steps.summary.outputs.has_summary == 'true' &&
          steps.summary.outputs.send_email == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Daily Work Summary — ${{ steps.subject.outputs.subject_date }}"
          to: kerry@zero2webmaster.com
          from: ${{ secrets.EMAIL_USERNAME }}
          html_body: file://${{ steps.summary.outputs.summary_file }}

      # Dead-man's-switch heartbeat (see Skill Vault [[scheduled-job-liveness]]).
      # Pings an Uptime Kuma PUSH monitor ONLY on the day's real run (should_run
      # == true) AND only if every prior step succeeded (success()) — so a silent
      # skip (guard never fires), a crash, OR a failed email send all WITHHOLD the
      # ping and trip the monitor in hours, not a week. No-op skipped runs and
      # quiet/no-commit days (should_run false) correctly do not ping.
      # Safe to merge before the secret exists: the step no-ops if it's unset.
      - name: Heartbeat — ping Uptime Kuma (dead-man's-switch)
        if: success() && steps.summary.outputs.should_run == 'true'
        env:
          UPTIME_KUMA_PUSH_URL: ${{ secrets.UPTIME_KUMA_PUSH_URL }}
        run: |
          if [ -z "$UPTIME_KUMA_PUSH_URL" ]; then
            echo "UPTIME_KUMA_PUSH_URL not configured — skipping heartbeat (no-op)."
            exit 0
          fi
          # Append status/msg as query params to the base push URL (…/api/push/<token>).
          curl -fsS --retry 2 --max-time 20 \
            "${UPTIME_KUMA_PUSH_URL}?status=up&msg=daily-summary-${{ steps.summary.outputs.local_date }}" \
            && echo "Heartbeat ping sent." \
            || echo "Heartbeat ping failed (non-fatal — Kuma unreachable, not the email)."
